<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Bannière LinkedIn</title>
<style>
  @font-face { font-family: 'Bricolage Grotesque'; font-weight: 400 800; src: url('../public/fonts/bricolage-latin.woff2') format('woff2'); }
  :root { --paper: #e7e3d9; --ink: #1b1a17; --red: #e3392b; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1584px; height: 396px; overflow: hidden; }
  body { position: relative; background: var(--paper); color: var(--ink); font-family: 'Bricolage Grotesque', sans-serif; }
  .label { position: absolute; top: 40px; font-size: 15px; text-transform: uppercase; letter-spacing: 0.14em; line-height: 1.35; }
  .logo { position: absolute; top: 36px; left: 48px; height: 44px; }
  .lead { position: absolute; left: 470px; top: 110px; max-width: 34ch; font-size: 26px; font-weight: 500; line-height: 1.15; }
  .title { position: absolute; left: 458px; bottom: 44px; font-weight: 800; font-size: 150px; line-height: 0.8; letter-spacing: -0.045em; color: var(--red); white-space: nowrap; }
  .photo { position: absolute; right: 56px; top: 76px; width: 204px; height: 272px; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.05); }
  .dot { position: absolute; right: 222px; top: 44px; width: 72px; height: 72px; border-radius: 50%; background: var(--red); z-index: 2; }
  .dot::after { content: ''; position: absolute; inset: -14%; border-radius: 50%; border: 1px dashed rgb(27 26 23 / 0.4); }
</style>
</head>
<body>
  <img class="logo" src="../public/logo.png" alt="ES" />
  <span class="label" style="left:470px">Développeur web &amp; app<br />freelance</span>
  <span class="label" style="left:960px">Sites vitrines, apps, SaaS<br />e-commerce, automatisation</span>
  <p class="lead">Je conçois et développe des sites, des applications et des automatisations pour les indépendants et les petites entreprises.</p>
  <div class="title">sur mesure</div>
  <span class="dot"></span>
  <div class="photo"><img src="../public/images/hero-bureau.webp" alt="" /></div>
</body>
</html>
